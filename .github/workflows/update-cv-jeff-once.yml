name: Update CV references and typography once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-cv-jeff-once.yml'
permissions:
  contents: write
jobs:
  revise-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools and serif fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
          python -m pip install pymupdf
      - name: Reformat third page and add Jeff Luckstead
        shell: bash
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          path=Path("assets/Umesh_Gautam_CV.pdf")
          tmp=Path("assets/.cv_jeff_revised.pdf")
          src=fitz.open(path)
          assert len(src)==3
          assert "Dr. Michael Noel" in src[2].get_text()
          assert "I develop structural models and employ advanced econometrics" in src[0].get_text()
          fdir="/usr/share/fonts/truetype/liberation/"
          names={"reg":fdir+"LiberationSerif-Regular.ttf","bold":fdir+"LiberationSerif-Bold.ttf","italic":fdir+"LiberationSerif-Italic.ttf"}
          roman=fitz.Font(fontfile=names["reg"])
          bold=fitz.Font(fontfile=names["bold"])
          doc=fitz.open()
          doc.insert_pdf(src,from_page=0,to_page=1,links=True,annots=True)
          p=doc[0]
          statement=("I develop structural models and employ advanced econometrics, calibration, and causal inference "
                     "to examine how policies affect trade, production, prices, employment, wages, and welfare "
                     "across different market structures.")
          p.add_redact_annot(fitz.Rect(47,288,565,326.1),fill=(1,1,1))
          p.apply_redactions(images=0,graphics=0,text=0)
          p.insert_font(fontname="CVreg",fontfile=names["reg"])
          lines=[];current=""
          for token in statement.split():
              candidate=(current+" "+token).strip()
              if roman.text_length(candidate,fontsize=11.3)>515:
                  lines.append(current);current=token
              else:current=candidate
          if current:lines.append(current)
          assert len(lines)==2,lines
          black=(31/255,31/255,31/255)
          for i,line in enumerate(lines):
              p.insert_text((48.3,302.2+15.2*i),line,fontname="CVreg",fontsize=11.3,color=black)
          p=doc.new_page(width=612,height=792)
          for k,v in names.items():p.insert_font(fontname="CV"+k,fontfile=v)
          def move(y):
              if y<38:return y
              if y<296:return y-7-.025*(y-52)
              if y<355:return y-18
              if y<411:return y-23
              if y<535:return y-29-.025*(y-423)
              if y<593:return y-37
              if y<754:return y-43
              return y
          def face(name):
              m={"LiberationSerif":"CVreg","Times-Roman":"CVreg","LiberationSerif-Bold":"CVbold",
                 "Times-Bold":"CVbold","LiberationSerif-Italic":"CVitalic","Times-Italic":"CVitalic"}
              return m[name]
          for blk in src[2].get_text("dict")["blocks"]:
              if blk["type"]!=0:continue
              for lin in blk["lines"]:
                  for s in lin["spans"]:
                      y=s["bbox"][1]
                      if 623<=y<754 or not s["text"].strip():continue
                      x,base=s["origin"];c=s["color"]
                      col=(((c>>16)&255)/255,((c>>8)&255)/255,(c&255)/255)
                      p.insert_text((x,move(y)+base-y),s["text"],fontname=face(s["font"]),fontsize=s["size"],color=col)
          for y in [68.4,325.2,382.3,439.7,561.6,620.5,757.8]:
              p.draw_line((48.3,move(y)),(563.8,move(y)),color=(.784,.804,.827),width=.58)
          refs=[
          ("Dr. Stephen Devadoss","Professor and Emabeth Thompson Endowed Professor","Department of Agricultural and Applied Economics, Texas Tech University","stephen.devadoss@ttu.edu"),
          ("Dr. Benaissa Chidmi","Associate Professor","Department of Agricultural and Applied Economics, Texas Tech University","benaissa.chidmi@ttu.edu"),
          ("Dr. Michael Noel","Professor","Department of Economics, Texas Tech University","michael.noel@ttu.edu"),
          ("Dr. Jeffrey Luckstead","Distinguished Professor of Agricultural and Resource Economics","School of Economic Sciences, Washington State University","jluckstead@wsu.edu")
          ]
          for i,(name,title,school,email) in enumerate(refs):
              y1=598+39*i;y2=y1+16.4
              p.insert_text((48.3,y1),name,fontname="CVbold",fontsize=12,color=black)
              p.insert_text((48.3+bold.text_length(name,fontsize=12),y1),"  |  "+title,fontname="CVreg",fontsize=12,color=black)
              prefix=school+"  |  "
              p.insert_text((48.3,y2),prefix,fontname="CVreg",fontsize=12,color=black)
              x2=48.3+roman.text_length(prefix,fontsize=12)
              p.insert_text((x2,y2),email,fontname="CVreg",fontsize=12,color=(0,.305,.57))
              width=roman.text_length(email,fontsize=12)
              assert x2+width<=563.9
              p.insert_link({"kind":fitz.LINK_URI,"from":fitz.Rect(x2,y2-12.2,x2+width,y2+3),"uri":"mailto:"+email})
          doc.set_metadata(src.metadata)
          doc.save(tmp,garbage=4,deflate=True)
          doc.close();src.close()
          test=fitz.open(tmp)
          assert len(test)==3
          assert "Dr. Jeffrey Luckstead" in test[2].get_text()
          assert len([l for l in test[2].get_links() if l["uri"].startswith("mailto:")])==4
          assert "I develop structural models" in test[0].get_text()
          test.close()
          tmp.replace(path)
          
          PY
      - name: Commit updated CV and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/update-cv-jeff-once.yml
          git add -A assets/Umesh_Gautam_CV.pdf .github/workflows/update-cv-jeff-once.yml
          git commit -m "Add WSU reference and improve CV spacing and text contrast"
          git push
