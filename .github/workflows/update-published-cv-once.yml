name: One-time published CV update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-published-cv-once.yml'
permissions:
  contents: write
jobs:
  update-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pymupdf
      - name: Update CV PDF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          p=Path("assets/Umesh_Gautam_CV.pdf")
          d=fitz.open(p)
          ink=(31/255,31/255,31/255); blue=(0,78/255,145/255)
          reg=fitz.Font(fontname="Times-Roman"); bold=fitz.Font(fontname="Times-Bold")
          page=d[0]
          page.add_redact_annot(fitz.Rect(46.5,267.5,567,285.5),fill=(1,1,1))
          page.add_redact_annot(fitz.Rect(63,602.8,568,683.2),fill=(1,1,1))
          page.apply_redactions(images=0,graphics=0,text=0)
          page.insert_text((48.35,280.8),"International Trade | Industrial Organization | Production Economics | Labor Economics",fontname="Times-Roman",fontsize=12,color=ink)
          lines=[
          "Global tree-nut trade is modeled using structural gravity with endogenous markups and a representative",
          "multiproduct firm in each exporting country. Perfect, monopolistic, Bertrand, and Cournot competition",
          "are evaluated against observed trade shares, with Cournot providing the best fit. A free-trade",
          "counterfactual predicts different trade reallocation and welfare responses across forms of market",
          "conduct. Results remain robust when allowing more symmetric firms per exporting country."
          ]
          for i,line in enumerate(lines):
           page.insert_text((64.9,615.6+15.7*i),line,fontname="Times-Roman",fontsize=12,color=ink)
          page=d[-1]
          page.add_redact_annot(fitz.Rect(47,626,565,745),fill=(1,1,1))
          page.apply_redactions(images=0,graphics=0,text=0)
          people=[
          ("Dr. Stephen Devadoss","Professor and Emabeth Thompson Endowed Professor","Department of Agricultural and Applied Economics","stephen.devadoss@ttu.edu",640.0),
          ("Dr. Benaissa Chidmi","Associate Professor","Department of Agricultural and Applied Economics","benaissa.chidmi@ttu.edu",681.9),
          ("Dr. Michael Noel","Professor","Department of Economics","michael.noel@ttu.edu",723.8)]
          for name,title,dept,mail,y in people:
           x=48.35
           page.insert_text((x,y),name,fontname="Times-Bold",fontsize=12,color=ink)
           x+=bold.text_length(name,fontsize=12)
           page.insert_text((x,y),"  |  "+title,fontname="Times-Roman",fontsize=12,color=ink)
           line=dept+", Texas Tech University  |  "
           page.insert_text((48.35,y+16.45),line,fontname="Times-Roman",fontsize=12,color=ink)
           x2=48.35+reg.text_length(line,fontsize=12)
           page.insert_text((x2,y+16.45),mail,fontname="Times-Roman",fontsize=12,color=blue)
           page.insert_link({"kind":fitz.LINK_URI,"from":fitz.Rect(x2,y+3.5,x2+reg.text_length(mail,fontsize=12),y+18.5),"uri":"mailto:"+mail})
          d.saveIncr()
          d.close()
          PY
      - name: Commit updated PDF and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/update-published-cv-once.yml
          git add -A assets/Umesh_Gautam_CV.pdf .github/workflows/update-published-cv-once.yml
          git commit -m "Update CV references and sync published PDF"
          git push
