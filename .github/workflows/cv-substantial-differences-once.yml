name: Update CV wording once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cv-substantial-differences-once.yml'
permissions:
  contents: write
jobs:
  update-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pymupdf
      - name: Revise the website CV PDF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          path=Path("assets/Umesh_Gautam_CV.pdf")
          doc=fitz.open(path)
          assert len(doc)==3, "Unexpected CV page count"
          page=doc[0]
          old="counterfactual predicts different trade reallocation and welfare responses across forms of market"
          assert old in page.get_text(), "Website CV description changed; refusing potentially incorrect edit"
          page.add_redact_annot(fitz.Rect(63,602.8,568,684.3),fill=(1,1,1))
          page.apply_redactions(images=0,graphics=0,text=0)
          lines=[
           "Global tree-nut trade is modeled using structural gravity with endogenous markups and a representative",
           "multiproduct firm in each exporting country. Perfect, monopolistic, Bertrand, and Cournot competition",
           "are evaluated against observed trade shares, with Cournot providing the best fit. A free-trade",
           "counterfactual predicts substantial differences in trade reallocation and welfare responses across forms",
           "of market conduct. Results remain robust when allowing more symmetric firms per exporting country."
          ]
          font=fitz.Font(fontname="Times-Roman")
          for i,line in enumerate(lines):
           assert font.text_length(line,fontsize=12)<=500, "Line too wide"
           page.insert_text((64.9,615.6+15.7*i),line,fontname="Times-Roman",fontsize=12,color=(31/255,31/255,31/255))
          doc.saveIncr()
          doc.close()
          check=fitz.open(path)
          assert "counterfactual predicts substantial differences" in check[0].get_text()
          assert "counterfactual predicts different" not in check[0].get_text()
          check.close()
          
          PY
      - name: Commit PDF update and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/cv-substantial-differences-once.yml
          git add -A assets/Umesh_Gautam_CV.pdf .github/workflows/cv-substantial-differences-once.yml
          git commit -m "Update CV trade and welfare wording"
          git push
