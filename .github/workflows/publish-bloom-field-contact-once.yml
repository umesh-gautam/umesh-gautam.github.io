name: Update CV contact alignment Bloom Award and research fields
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-bloom-field-contact-once.yml'
permissions:
  contents: write
jobs:
  update-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF dependencies and serif fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
          python -m pip install reportlab pymupdf
      - name: Rebuild and validate consistently paginated CV
        shell: bash
        run: |
          python - <<'PY'
          import zlib,base64,fitz
          payload=""
          script=zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          patches=[["OUT=ROOT+'/Umesh_Gautam_CV_Professionally_Organized.pdf'","OUT=ROOT+'/Umesh_Gautam_CV_Refined_Research_Grants.pdf'"],["spaceBefore=9,spaceAfter=5.5)\ndefine('section'","spaceBefore=9,spaceAfter=5.5,keepWithNext=1)\ndefine('section'"],["spaceBefore=16.2,spaceAfter=7.5)","spaceBefore=14.5,spaceAfter=7,keepWithNext=1)"],["story.append(PageBreak())\nsub('Papers Under Review')","sub('Papers Under Review')"],["story.append(PageBreak())\nheading('Honors & Awards',first=True)","heading('Honors & Awards')"],["for a,b in awards:dated_row(a,b,spaceBelow=7)","for i,(a,b) in enumerate(awards):\n    dated_row(a,b,spaceBelow=6)\n    if i==3:\n        story.append(PageBreak())\n        heading('Honors & Awards (continued)',first=True)"],["+student+' &nbsp; | &nbsp; <b>Graduate Student:</b> Umesh Gautam'","+student+'<br/><b>Graduate Student Mentor:</b> Umesh Gautam'"],["Spacer(1,11)\n    ]","Spacer(1,7)\n    ]"],["story.append(PageBreak())\nheading('Technical Skills',first=True)","heading('Technical Skills')"],["]:dated_row(a,b,spaceBelow=11)","]:dated_row(a,b,spaceBelow=5)"]]
          for old,new in patches:
              assert script.count(old)==1,(repr(old),script.count(old))
              script=script.replace(old,new)
          needle='<br/><b>Graduate Student Mentor:</b> Umesh Gautam'
          assert script.count(needle)==1
          script=script.replace(needle,'<br/><b>Graduate Student Mentor:</b> <b>Umesh Gautam</b>')
          margin_grant_updates=[["define('section',fontName='CV-Bold',fontSize=12.45,leading=16,spaceBefore=14.5,spaceAfter=7,keepWithNext=1)","define('section',fontName='CV-Bold',fontSize=12.45,leading=16,spaceBefore=14.5,spaceAfter=7,keepWithNext=1)\ndefine('sectiontop',fontName='CV-Bold',fontSize=12.45,leading=16,spaceBefore=0,spaceAfter=7,keepWithNext=1)"],["    if first:space(5)\n    story.append(CondPageBreak(56))\n    story.append(P(title.upper(),'section'))","    story.append(CondPageBreak(56))\n    story.append(P(title.upper(),'sectiontop' if first else 'section'))"],["P('<b>“'+escape(title)+'”</b> &nbsp; ('+year+')','grant')","P('“'+escape(title)+'” &nbsp; ('+year+')','grant')"],["<b>$12,000</b>","$12,000"],["P('<b>Project Director:</b> Stephen Devadoss &nbsp; | &nbsp; <b>Undergraduate Student:</b> '+student+'<br/><b>Graduate Student Mentor:</b> <b>Umesh Gautam</b>','grantmeta')","P('Project Director: Stephen Devadoss &nbsp; | &nbsp; Undergraduate Student: '+student+'<br/>Graduate Student Mentor: <b>Umesh Gautam</b>','grantmeta')"],["topMargin=39,bottomMargin=46","topMargin=49,bottomMargin=49"]]
          for old,new in margin_grant_updates:
              assert script.count(old)==1,(repr(old),script.count(old))
              script=script.replace(old,new)
          grant_code=script.split("heading('Research Grants')",1)[1].split("heading('Technical Skills')",1)[0]
          assert grant_code.count('<b>Umesh Gautam</b>')==1
          assert grant_code.count('<b>')==1
          assert 'topMargin=49,bottomMargin=49' in script
          final_cv_edits=[["from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle, PageBreak, KeepTogether, HRFlowable, CondPageBreak","from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle, PageBreak, KeepTogether, HRFlowable, CondPageBreak, Flowable"],["define('bodyindent',fontSize=11.05,leading=15.25,leftIndent=13,spaceAfter=7)","define('bodyindent',fontSize=11.05,leading=15.25,leftIndent=13,spaceAfter=7)\\ndefine('papersummary',fontSize=11.05,leading=15.25,leftIndent=18,spaceAfter=7)"],["spaceBefore=14.5,spaceAfter=7,keepWithNext=1)","spaceBefore=14.5,spaceAfter=3,keepWithNext=1)"],["spaceBefore=0,spaceAfter=7,keepWithNext=1)","spaceBefore=0,spaceAfter=3,keepWithNext=1)"],["across forms of market conduct. Results remain robust when allowing more symmetric firms per exporting country.','bodyindent')","across forms of market conduct. Results remain robust when allowing more symmetric firms per exporting country.','papersummary')"],["'<b>Bloom Award</b>, Spring into Discovery Research Slam Competition, Texas Tech University.<br/><i>Consequences of Stricter Immigration Enforcement for U.S. Vegetable Production.</i>'","'<b>Bloom Award</b>, Texas Tech University.<br/>Spring into Discovery Research Slam Competition.<br/><b>Consequences of Stricter Immigration Enforcement for U.S. Vegetable Production.</b>'"],["heading('References')\\nrefs=[","story.append(PageBreak())\\nheading('References',first=True)\\nrefs=["],["add('<link href=\"mailto:umesh.gautam@ttu.edu\" color=\"#263d54\">umesh.gautam@ttu.edu</link> &nbsp; | &nbsp; +1 (806) 319-4131 &nbsp; | &nbsp; <link href=\"https://umesh-gautam.github.io/\" color=\"#263d54\">umesh-gautam.github.io</link>','headerlink')","class ContactLine(Flowable):\n    def __init__(self):\n        Flowable.__init__(self)\n        self.width=CONTENT-12\n        self.height=16.5\n    def draw(self):\n        c=self.canv\n        fontsize=10.25\n        c.setLineWidth(.85)\n        groups=[('email','umesh.gautam@ttu.edu','mailto:umesh.gautam@ttu.edu'),\n                ('phone','+1 (806) 319-4131',None),\n                ('globe','umesh-gautam.github.io','https://umesh-gautam.github.io/')]\n        sepwidth=18\n        widths=[10+4+pdfmetrics.stringWidth(label,'CV',fontsize) for _,label,_ in groups]\n        x=(self.width-sum(widths)-sepwidth*2)/2\n        y=3.2\n        for i,(kind,label,url) in enumerate(groups):\n            if i:\n                c.setFillColor(SOFT)\n                c.setFont('CV',fontsize)\n                c.drawCentredString(x+sepwidth/2,y,'|')\n                x+=sepwidth\n            c.setStrokeColor(ACCENT)\n            if kind=='email':\n                c.roundRect(x,y+2.0,9.5,7.0,1,stroke=1,fill=0)\n                path=c.beginPath()\n                path.moveTo(x+.4,y+8.2)\n                path.lineTo(x+4.75,y+4.6)\n                path.lineTo(x+9.1,y+8.2)\n                c.drawPath(path,stroke=1)\n            elif kind=='globe':\n                c.circle(x+4.75,y+5.4,4.45,stroke=1,fill=0)\n                c.line(x+.8,y+5.4,x+8.7,y+5.4)\n                p=c.beginPath()\n                p.moveTo(x+4.75,y+1.0)\n                p.curveTo(x+2.25,y+3.4,x+2.25,y+7.4,x+4.75,y+9.85)\n                p.curveTo(x+7.25,y+7.4,x+7.25,y+3.4,x+4.75,y+1.0)\n                c.drawPath(p,stroke=1)\n            else:\n                p=c.beginPath()\n                p.moveTo(x+1,y+9.7)\n                p.curveTo(x+.1,y+8.2,x+1.2,y+5.5,x+3,y+3.6)\n                p.curveTo(x+4.8,y+1.7,x+7.6,y+.6,x+9.0,y+1.5)\n                p.lineTo(x+7.5,y+3.5)\n                p.lineTo(x+5.9,y+2.9)\n                p.curveTo(x+4.0,y+3.8,x+2.8,y+5.4,x+2.4,y+7.0)\n                p.lineTo(x+3.0,y+8.2)\n                p.close()\n                c.drawPath(p,stroke=1)\n            c.setFont('CV',fontsize)\n            c.setFillColor(ACCENT if url else DARK)\n            x0=x+14\n            c.drawString(x0,y,label)\n            if url:\n                c.linkURL(url,(x0,y-1,x0+pdfmetrics.stringWidth(label,'CV',fontsize),y+fontsize+2),relative=1,thickness=0)\n            x+=10+4+pdfmetrics.stringWidth(label,'CV',fontsize)\nstory.append(ContactLine())"]]
          for old,new in final_cv_edits:
              new=new.replace('\\n','\n') if '\\n' in new else new
              old=old.replace('\\n','\n') if '\\n' in old else old
              assert script.count(old)==1,(repr(old[:120]),script.count(old))
              script=script.replace(old,new)
          replacements=[
              ('Gautam, U.', '<b>Gautam, U.</b>', 10),
              ('U. Gautam*', '<b>U. Gautam*</b>', 1),
              ('U. Gautam.', '<b>U. Gautam</b>.', 1),
          ]
          for old,new,count in replacements:
              assert script.count(old)==count,(old,script.count(old))
              script=script.replace(old,new)
          assert "<b>Does Market Conduct Matter?" in script
          assert "P('“'+escape(title)+'” &nbsp; ('+year+')','grant')" in script
          latest_edits=[["self.width=CONTENT-12","self.width=CONTENT"],["sepwidth=18","sepwidth=16"],["y=3.2","y=4.2"],["c.setStrokeColor(ACCENT)\n            if kind=='email':","c.setStrokeColor(ACCENT)\n            # Consistent vertical alignment between each icon and its label.\n            center=y+2.7\n            if kind=='email':"],["c.roundRect(x,y+2.0,9.5,7.0,1,stroke=1,fill=0)","c.roundRect(x,center-3.4,9.5,6.8,1,stroke=1,fill=0)"],["path.moveTo(x+.4,y+8.2)","path.moveTo(x+.4,center+2.7)"],["path.lineTo(x+4.75,y+4.6)","path.lineTo(x+4.75,center-.8)"],["path.lineTo(x+9.1,y+8.2)","path.lineTo(x+9.1,center+2.7)"],["c.circle(x+4.75,y+5.4,4.45,stroke=1,fill=0)","c.circle(x+4.75,center,4.1,stroke=1,fill=0)"],["c.line(x+.8,y+5.4,x+8.7,y+5.4)","c.line(x+.8,center,x+8.7,center)"],["p.moveTo(x+4.75,y+1.0)","p.moveTo(x+4.75,center-4.1)"],["p.curveTo(x+2.25,y+3.4,x+2.25,y+7.4,x+4.75,y+9.85)","p.curveTo(x+2.25,center-2.2,x+2.25,center+2.2,x+4.75,center+4.1)"],["p.curveTo(x+7.25,y+7.4,x+7.25,y+3.4,x+4.75,y+1.0)","p.curveTo(x+7.25,center+2.2,x+7.25,center-2.2,x+4.75,center-4.1)"],["p.moveTo(x+1,y+9.7)","p.moveTo(x+1,center+3.8)"],["p.curveTo(x+.1,y+8.2,x+1.2,y+5.5,x+3,y+3.6)","p.curveTo(x+.1,center+2.3,x+1.2,center-.4,x+3,center-2.3)"],["p.curveTo(x+4.8,y+1.7,x+7.6,y+.6,x+9.0,y+1.5)","p.curveTo(x+4.8,center-4.1,x+7.6,center-5.1,x+9.0,center-4.2)"],["p.lineTo(x+7.5,y+3.5)","p.lineTo(x+7.5,center-2.2)"],["p.lineTo(x+5.9,y+2.9)","p.lineTo(x+5.9,center-2.8)"],["p.curveTo(x+4.0,y+3.8,x+2.8,y+5.4,x+2.4,y+7.0)","p.curveTo(x+4.0,center-1.9,x+2.8,center-.3,x+2.4,center+1.3)"],["p.lineTo(x+3.0,y+8.2)","p.lineTo(x+3.0,center+2.5)"],["def dated_row(content,date,spaceBelow=7):","def dated_row(content,date,spaceBelow=7,wide=False):"],["colWidths=[CONTENT-132,132]","colWidths=[CONTENT-(94 if wide else 132),94 if wide else 132]"],["Production Economics &nbsp; | &nbsp; Labor Economics","Labor Economics &nbsp; | &nbsp; Production Economics"],[" <b>2027 (Forthcoming).</b> "," 2027 (Forthcoming). "],["'<b>Bloom Award</b>, Texas Tech University.<br/>Spring into Discovery Research Slam Competition.<br/><b>Consequences of Stricter Immigration Enforcement for U.S. Vegetable Production.</b>'","'<b>Bloom Award</b><br/>Spring into Discovery Research Slam Competition, Texas Tech University.<br/><b>Consequences of Stricter Immigration Enforcement for U.S. Vegetable Production.</b>'"],["    dated_row(a,b,spaceBelow=6)\n    if i==3:","    dated_row(a,b,spaceBelow=6,wide=(i==0))\n    if i==3:"]]
          for old,new in latest_edits:
              assert script.count(old)==1,(repr(old[:90]),script.count(old))
              script=script.replace(old,new)
          exec(compile(script,'rebuild_refined_cv.py','exec'))
          test=fitz.open('assets/Umesh_Gautam_CV_Refined_Research_Grants.pdf')
          full=' '.join(page.get_text() for page in test)
          assert len(test)==4
          assert full.count('Graduate Student Mentor:')==2
          assert full.count('$12,000')==2
          assert all(max(b[3] for b in test[i].get_text('blocks') if b[4].strip() and b[1]<750)>690 for i in range(2))
          assert 'Dr. Jeffrey Luckstead' in test[3].get_text()
          mentor_lines=[]
          for block in test[2].get_text('dict')['blocks']:
              for line in block.get('lines',[]):
                  if 'Graduate Student Mentor:' in ''.join(span['text'] for span in line['spans']):
                      mentor_lines.append(line)
          assert len(mentor_lines)==2
          assert all(any('Umesh Gautam' in span['text'] and 'Bold' in span['font'] for span in line['spans']) for line in mentor_lines)
          for b in test[2].get_text('dict')['blocks']:
              for line in b.get('lines',[]):
                  spans=line['spans']
                  st=''.join(sp['text'] for sp in spans)
                  if any(w in st for w in ['Project Director:', 'Davis College Undergraduate Research Grant',
                                           'Ethnic Population in the United States', 'U.S.-Mexico GM Corn Trade']):
                      assert all('Bold' not in sp['font'] for sp in spans),st
                  if 'Graduate Student Mentor:' in st:
                      assert all('Bold' not in sp['font'] for sp in spans if 'Umesh Gautam' not in sp['text'])
          assert 'Bloom Award' in test[1].get_text()
          assert 'Papers Under Review' in test[0].get_text()
          assert 'REFERENCES' not in test[2].get_text()
          assert 'REFERENCES' in test[3].get_text()
          assert any(l.get('uri')=='mailto:umesh.gautam@ttu.edu' for l in test[0].get_links())
          assert any(l.get('uri')=='https://umesh-gautam.github.io/' for l in test[0].get_links())
          for i in (0,1):
              spans=[s for b in test[i].get_text('dict')['blocks'] if 'lines' in b for ln in b['lines'] for s in ln['spans']]
              assert all('Bold' in s['font'] for s in spans if s['text'].strip() in ('Gautam, U.','U. Gautam*','U. Gautam'))
          grant_spans=[s for b in test[2].get_text('dict')['blocks'] if 'lines' in b for ln in b['lines'] for s in ln['spans']]
          assert all('Bold' not in s['font'] for s in grant_spans if 'Ethnic Population in the United States' in s['text'] or 'U.S.-Mexico GM Corn Trade' in s['text'])
          first=test[0].get_text()
          second=test[1].get_text()
          assert 'Industrial Organization   |   Labor Economics   |   Production Economics' in first
          assert '2027 (Forthcoming)' in first
          assert 'Bloom Award' in second
          assert 'Spring into Discovery Research Slam Competition, Texas Tech University.' in second
          assert 'Consequences of Stricter Immigration Enforcement for U.S. Vegetable Production.' in second
          assert any(l.get('uri')=='mailto:umesh.gautam@ttu.edu' for l in test[0].get_links())
          assert any(l.get('uri')=='https://umesh-gautam.github.io/' for l in test[0].get_links())
          test.close()
          PY
          mv assets/Umesh_Gautam_CV_Refined_Research_Grants.pdf assets/Umesh_Gautam_CV.pdf
      - name: Publish updated website CV and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/publish-bloom-field-contact-once.yml
          git add -A assets/Umesh_Gautam_CV.pdf .github/workflows/publish-bloom-field-contact-once.yml
          git commit -m "Align CV header icons, Bloom Award, forthcoming year and field order"
          git push
