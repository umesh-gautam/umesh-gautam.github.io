name: Add fifth academic CV reference once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-fifth-cv-reference-once.yml'
permissions:
  contents: write
jobs:
  edit-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install font and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
          python -m pip install pymupdf pillow
      - name: Insert verified Mottaleb reference in existing CV
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz,os
          from PIL import Image,ImageChops
          src=Path("assets/Umesh_Gautam_CV.pdf")
          old=fitz.open(src)
          doc=fitz.open(src)
          assert len(doc)==4
          p=doc[3]
          lines=[l for b in old[3].get_text("dict")["blocks"]
                 for l in b.get("lines",[])
                 if 220<l["bbox"][1]<280]
          assert len(lines)==2,(len(lines),[l["bbox"] for l in lines])
          assert "Dr. Jeffrey Luckstead" in "".join(s["text"] for s in lines[0]["spans"])
          assert "jluckstead@wsu.edu" in "".join(s["text"] for s in lines[1]["spans"])
          assert "Khondoker" not in old[3].get_text()
          links=[lk for lk in p.get_links() if lk.get("uri")=="mailto:jluckstead@wsu.edu"]
          assert len(links)==1
          for lk in links:p.delete_link(lk)
          p.add_redact_annot(fitz.Rect(54,232,565,270),fill=(1,1,1))
          p.apply_redactions(images=0,graphics=0,text=0)
          folder="/usr/share/fonts/truetype/liberation"
          fonts={"R":folder+"/LiberationSerif-Regular.ttf",
                 "B":folder+"/LiberationSerif-Bold.ttf"}
          for k,v in fonts.items():p.insert_font(fontname="Ref"+k,fontfile=v)
          faces={k:fitz.Font(fontfile=v) for k,v in fonts.items()}
          size=lines[0]["spans"][0]["size"]
          assert 11<size<11.2
          ink=lines[0]["spans"][0]["color"]
          blue=next(s["color"] for b in old[3].get_text("dict")["blocks"]
                    for l in b.get("lines",[]) for s in l["spans"]
                    if "stephen.devadoss@ttu.edu" in s["text"])
          def rgb(n):return ((n>>16&255)/255.,(n>>8&255)/255.,(n&255)/255.)
          y1=lines[0]["spans"][0]["origin"][1]
          y2=lines[1]["spans"][0]["origin"][1]
          left=lines[0]["spans"][0]["origin"][0]
          def write(parts,y):
              x=left
              locations={}
              for t,k in parts:
                  if "@" in t:locations[t]=x
                  c=blue if "@" in t else ink
                  p.insert_text((x,y),t,fontname="Ref"+k,fontsize=size,color=rgb(c))
                  x+=faces[k].text_length(t,fontsize=size)
              assert x<560,x
              return locations
          write([("Dr. Khondoker A. Mottaleb","B"),("   |   Assistant Professor","R")],y1)
          m=write([("Department of Agricultural and Applied Economics, Texas Tech University   |   ","R"),
                    ("K.Mottaleb@ttu.edu","R")],y2)
          write([("Dr. Jeffrey Luckstead","B"),
                 ("   |   Distinguished Professor of Agricultural and Resource Economics","R")],y1+50.8)
          j=write([("School of Economic Sciences, Washington State University   |   ","R"),
                   ("jluckstead@wsu.edu","R")],y2+50.8)
          for email,x,y in [("K.Mottaleb@ttu.edu",m["K.Mottaleb@ttu.edu"],y2),
                            ("jluckstead@wsu.edu",j["jluckstead@wsu.edu"],y2+50.8)]:
              p.insert_link({"kind":fitz.LINK_URI,
                             "from":fitz.Rect(x,y-size*.95,x+faces["R"].text_length(email,fontsize=size),y+size*.25),
                             "uri":"mailto:"+email})
          tmp=Path("assets/.cv_five_refs_temp.pdf")
          doc.save(tmp,garbage=3,deflate=True)
          doc.close()
          cv=fitz.open(tmp)
          assert len(cv)==4
          for i in range(3):
              assert cv[i].get_text()==old[i].get_text(),i
              assert cv[i].get_pixmap().samples==old[i].get_pixmap().samples,i
          txt=cv[3].get_text()
          assert txt.index("Dr. Michael Noel")<txt.index("Dr. Khondoker A. Mottaleb")<txt.index("Dr. Jeffrey Luckstead")
          assert txt.count("Dr. Khondoker A. Mottaleb")==1
          assert txt.count("Dr. Jeffrey Luckstead")==1
          assert txt.count("K.Mottaleb@ttu.edu")==1
          uris={a["uri"] for a in cv[3].get_links()}
          assert len(uris)==5 and "mailto:K.Mottaleb@ttu.edu" in uris and "mailto:jluckstead@wsu.edu" in uris,uris
          assert "Scheduled Spring 2027" in cv[1].get_text()
          assert "Working Papers" in cv[0].get_text()
          assert "Gautam, U., and S. Devadoss. 2026. Does Market Conduct Matter?" in " ".join(cv[0].get_text().split())
          mat=fitz.Matrix(1.5,1.5)
          before=old[3].get_pixmap(matrix=mat,alpha=False)
          after=cv[3].get_pixmap(matrix=mat,alpha=False)
          diff=ImageChops.difference(Image.frombytes("RGB",(before.width,before.height),before.samples),
                                     Image.frombytes("RGB",(after.width,after.height),after.samples)).getbbox()
          assert diff and diff[1]/1.5>=230 and diff[3]/1.5<340,diff
          cv.close();old.close()
          os.replace(tmp,src)
          print("PASS: only fifth reference added before Luckstead, four-page CV verified")
          
          PY
      - name: Publish and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm '.github/workflows/add-fifth-cv-reference-once.yml'
          git add -A assets/Umesh_Gautam_CV.pdf '.github/workflows/add-fifth-cv-reference-once.yml'
          git commit -m "Add Khondoker A. Mottaleb as fifth CV reference"
          git push
