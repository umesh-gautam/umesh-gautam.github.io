name: Verify original CV parity once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-approved-cv-parity-once.yml'
permissions:
  contents: write
jobs:
  verify-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every page against approved CV
        run: |
          python -m pip install pymupdf
          python - <<'PY'
          import fitz, hashlib
          d=fitz.open('assets/Umesh_Gautam_CV.pdf')
          expected=["503749175d957dc57753931a28498dd578a7a12a3a65ce7704304f7f58c5db11","8d8a65567c441a43d967e63e07d15b8a960632b93f21d3c642c7be3395f4ce90","d15efd78525729686d3bcbfdea509e1507718f68886fee7523503f6e2a991f2a","e2b1473bba96b6ad89bb9b7e45a4d33237840f99121741c62e5726645b56b4c0"]
          assert len(d)==4
          got=[hashlib.sha256(' '.join(page.get_text().split()).encode()).hexdigest() for page in d]
          print('Expected page hashes',expected)
          print('Hosted page hashes',got)
          assert got==expected,'The website CV differs from the approved master beyond the sentence edit'
          print('All four pages match the approved CV text, including the requested revised research sentence.')
          PY
      - name: Remove one-time verification workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm '.github/workflows/verify-approved-cv-parity-once.yml'
          git add '.github/workflows/verify-approved-cv-parity-once.yml'
          git commit -m "Clean up one-time CV verification"
          git push
