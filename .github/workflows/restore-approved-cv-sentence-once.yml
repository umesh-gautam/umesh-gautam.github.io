name: Restore approved four page CV with sentence-only edit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-approved-cv-sentence-once.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF editing and validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
          python -m pip install pymupdf pillow
      - name: Restore original layout and replace research statement only
        shell: bash
        run: |
          git show 7ab2d13ce87ca9b472de102d3d34edfb19fe0f90:assets/Umesh_Gautam_CV.pdf > /tmp/approved-layout.pdf
          python - <<'PY'
          from pathlib import Path
          import fitz
          from PIL import Image,ImageChops
          import os
          original=fitz.open('/tmp/approved-layout.pdf')
          assert len(original)==4
          page=original[0]
          prev="I develop structural models and employ advanced econometrics, calibration, and causal inference to examine how policies affect trade, production, prices, employment, wages, and welfare across different market structures."
          revised="I develop structural economic models and employ advanced econometric methods, including causal inference, and calibration to evaluate policies by analyzing their effects on trade, production, prices, employment, wages, and welfare across different market structures."
          old=' '.join(page.get_text().split())
          assert prev in old, 'Cannot establish the approved CV text'
          for need in ('Papers Under Review','RESEARCH FIELDS','RESEARCH EXPERIENCE'):
              assert need in page.get_text(),need
          assert 'Dr. Jeffrey Luckstead' in original[3].get_text()
          assert 'Graduate Student Mentor: Umesh Gautam' in original[2].get_text()
          old_spans=[]
          for b in page.get_text('dict')['blocks']:
              for ln in b.get('lines',[]):
                  for s in ln['spans']:
                      if s['text'].startswith(('I develop structural models','how policies affect trade')):
                          old_spans.append(s)
          assert len(old_spans)==2,len(old_spans)
          old_spans.sort(key=lambda s:s['origin'][1])
          size=old_spans[0]['size']
          assert 11.0<=size<=11.4, size
          assert all(abs(s['size']-size)<.1 for s in old_spans)
          font_path='/usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf'
          font=fitz.Font(fontfile=font_path)
          x,y=old_spans[0]['origin']
          heading=page.search_for('RESEARCH EXPERIENCE')[0]
          lines=[];current=''
          for w in revised.split():
              test=(current+' '+w).strip()
              if current and font.text_length(test,fontsize=size)>min(514,568-x):
                  lines.append(current);current=w
              else:
                  current=test
          if current:lines.append(current)
          assert len(lines)==3,lines
          leading=old_spans[1]['origin'][1]-y
          assert 14.8<leading<16.1
          assert y+2*leading+2.8 < heading.y0-3.5, ('overlap',y,leading,heading.y0)
          bbox=fitz.Rect(x-.4,old_spans[0]['bbox'][1]-1.0,569,old_spans[-1]['bbox'][3]+2)
          baseline=fitz.open('/tmp/approved-layout.pdf')
          page.add_redact_annot(bbox,fill=(1,1,1))
          page.apply_redactions(images=0,graphics=0,text=0)
          page.insert_font(fontname='CVOriginalSerif',fontfile=font_path)
          color=old_spans[0]['color']
          rgb=(((color>>16)&255)/255.0,((color>>8)&255)/255.0,(color&255)/255.0)
          for i,line in enumerate(lines):
              page.insert_text((x,y+i*leading),line,fontsize=size,fontname='CVOriginalSerif',color=rgb)
          output=Path('assets/Umesh_Gautam_CV.pdf')
          original.save('/tmp/new_cv.pdf',garbage=3,deflate=True)
          original.close()
          test=fitz.open('/tmp/new_cv.pdf')
          assert len(test)==4
          assert revised in ' '.join(test[0].get_text().split())
          for idx in range(1,4):
              assert test[idx].get_text()==baseline[idx].get_text(),f'page {idx+1} content changed'
          assert all('Papers Under Review' in test[0].get_text() for _ in [1])
          for idx in range(4):
              a=baseline[idx].get_pixmap(matrix=fitz.Matrix(1.25,1.25),alpha=False)
              b=test[idx].get_pixmap(matrix=fitz.Matrix(1.25,1.25),alpha=False)
              assert (a.width,a.height)==(b.width,b.height)
              diff=ImageChops.difference(Image.frombytes('RGB',(a.width,a.height),a.samples),
                                         Image.frombytes('RGB',(b.width,b.height),b.samples))
              bounds=diff.getbbox()
              if idx>=1: assert bounds is None,f'Unrelated changes on page {idx+1}: {bounds}'
              else:
                  assert bounds is not None
                  assert bounds[1]>=int((bbox.y0-1)*1.25)
                  assert bounds[3]<=int((heading.y0-3)*1.25),bounds
          assert 'Graduate Student Mentor: Umesh Gautam' in test[2].get_text()
          assert 'Dr. Jeffrey Luckstead' in test[3].get_text()
          test.close();baseline.close()
          os.replace('/tmp/new_cv.pdf',output)
          print('Restored approved four-page layout and revised one description only')
          PY
      - name: Commit restored website CV, remove temporary action
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/restore-approved-cv-sentence-once.yml
          git add -A assets/Umesh_Gautam_CV.pdf .github/workflows/restore-approved-cv-sentence-once.yml
          git commit -m "Restore approved CV layout and update research statement sentence only"
          git push
