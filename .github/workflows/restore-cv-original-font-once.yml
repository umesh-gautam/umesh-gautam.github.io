name: Restore 12-point body text on website CV
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-cv-original-font-once.yml'
permissions:
  contents: write
jobs:
  restore-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF dependencies and serif fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
          python -m pip install reportlab pymupdf
      - name: Rebuild website CV with original font sizes
        shell: bash
        run: |
          python - <<'PY'
          import base64,zlib,pymupdf as fitz,pathlib,os
          packed=""
          code=zlib.decompress(base64.b64decode(packed)).decode("utf-8")
          assert "fontSize=12" in code
          code=code.replace("ROOT=Path('/mnt/data')","ROOT=Path('assets')")
          code=code.replace("ROOT/'Umesh_Gautam_CV_Restored_12pt.pdf'","ROOT/'Umesh_Gautam_CV_Original_Font_Size.pdf'")
          exec(compile(code,'cv.py','exec'))
          path=pathlib.Path('assets/Umesh_Gautam_CV_Original_Font_Size.pdf')
          doc=fitz.open(path)
          assert len(doc)==4
          alltext=' '.join(p.get_text() for p in doc)
          assert '2027 (Forthcoming)' in alltext
          assert 'Ethnic Population in the United States' in alltext
          assert 'U.S.-Mexico GM Corn Trade Dispute' in alltext
          assert 'Dr. Jeffrey Luckstead' in alltext
          spans=[s for pg in doc for block in pg.get_text('dict')['blocks'] if 'lines' in block for line in block['lines'] for s in line['spans'] if s['text'].strip()]
          assert all(s['size']>=11.99 for s in spans if s['size']<14 and not (s['size']<=9.01)),[(s['size'],s['text']) for s in spans if 9.1<s['size']<11.99][:5]
          assert len([x for x in doc[0].get_links() if x.get('uri','').startswith('mailto:')])==1
          doc.close()
          os.replace(path,'assets/Umesh_Gautam_CV.pdf')
          PY
      - name: Publish corrected PDF and clean up one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/restore-cv-original-font-once.yml
          git add -A assets/Umesh_Gautam_CV.pdf .github/workflows/restore-cv-original-font-once.yml
          git commit -m "Restore original 12pt CV body font without reducing text size"
          git push
