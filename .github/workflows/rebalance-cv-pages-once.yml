name: Rebalance website CV sections once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebalance-cv-pages-once.yml'
permissions:
  contents: write
jobs:
  balance-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools and serif font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
          python -m pip install pymupdf
      - name: Move honors into available space on page two
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          source=Path("assets/Umesh_Gautam_CV.pdf")
          output=Path("assets/.Umesh_Gautam_CV_Rebalanced.pdf")
          old=fitz.open(source)
          assert len(old)==3
          assert "CONFERENCE PRESENTATIONS" in old[1].get_text()
          assert "HONORS & AWARDS" in old[2].get_text()
          assert "Dr. Jeffrey Luckstead" in old[2].get_text()
          cv=fitz.open()
          cv.insert_pdf(old,from_page=0,to_page=1,links=True,annots=True)
          page2=cv[1]
          clip=fitz.Rect(44,40,566,161.7)
          page2.show_pdf_page(fitz.Rect(clip.x0,clip.y0+579,clip.x1,clip.y1+579),old,2,
                              clip=clip,overlay=True,keep_proportion=False)
          page3=cv.new_page(width=612,height=792)
          segments=[
           ((43,162,567,283),-83),
           ((43,287,567,337),-77),
           ((43,338,567,391),-69),
           ((43,392,567,500),-61),
           ((43,503,567,554),-52),
           ((43,557,567,743),-43),
           ((43,752,567,776),0),
          ]
          for coords,dy in segments:
              area=fitz.Rect(*coords)
              page3.show_pdf_page(fitz.Rect(area.x0,area.y0+dy,area.x1,area.y1+dy),
                                  old,2,clip=area,keep_proportion=False,overlay=True)
          boldpath="/usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf"
          page3.insert_font(fontname="RebalanceBold",fontfile=boldpath)
          page3.insert_text((48.3,59.1),"HONORS & AWARDS (CONTINUED)",
                            fontname="RebalanceBold",fontsize=12.75,
                            color=(31/255,31/255,31/255))
          page3.draw_line((48.3,67),(563.8,67),color=(200/255,205/255,211/255),width=.58)
          for link in old[2].get_links():
              if link.get("kind")!=fitz.LINK_URI or not link.get("uri"):continue
              r=fitz.Rect(link["from"])
              if r.y0>=557 and r.y1<=743:
                  page3.insert_link({"kind":fitz.LINK_URI,
                    "from":fitz.Rect(r.x0,r.y0-43,r.x1,r.y1-43),"uri":link["uri"]})
          cv.set_metadata(old.metadata)
          cv.save(output,garbage=4,deflate=True)
          cv.close();old.close()
          check=fitz.open(output)
          assert len(check)==3
          p2=check[1].get_text()
          p3=check[2].get_text()
          assert "Bloom Award" in p2
          assert "Summer Thesis" in p2
          assert "HONORS & AWARDS (CONTINUED)" in p3
          assert "Dr. Jeffrey Luckstead" in p3
          assert "REFERENCES" in p3 and "PROFESSIONAL SERVICE" in p3
          assert len([l for l in check[2].get_links() if l["uri"].startswith("mailto:")])==4
          check.close()
          output.replace(source)
          
          PY
      - name: Publish CV and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/rebalance-cv-pages-once.yml
          git add -A assets/Umesh_Gautam_CV.pdf .github/workflows/rebalance-cv-pages-once.yml
          git commit -m "Rebalance honors and references across CV pages"
          git push
