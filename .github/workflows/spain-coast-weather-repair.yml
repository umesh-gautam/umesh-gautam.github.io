name: Recover missing valid coastal and mountain crop weather
on:
  push:
    branches: [sigma-spain-coastfix-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        part: [0,1,2]
    env:
      PART: "${{ matrix.part }}"
    steps:
      - uses: actions/checkout@v4
      - run: python sigma_research/repair_land_weather.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-land-weather-part-${{ matrix.part }}
          path: repaired_weather/
