name: Update CV working papers and journal targets once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cv-working-papers-targets-once.yml'
permissions:
  contents: write
jobs:
  revise-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF editor and original serif font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
          python -m pip install pymupdf
      - name: Make only approved CV research heading and target journal updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz, os
          P=Path("assets/Umesh_Gautam_CV.pdf")
          original=fitz.open(P)
          assert len(original)==4
          assert "Papers Under Review" in original[0].get_text()
          assert "Working Papers" not in original[0].get_text()
          assert "Research in Progress" in original[1].get_text()
          assert "Dr. Jeffrey Luckstead" in original[3].get_text()
          fontdir="/usr/share/fonts/truetype/liberation/"
          fonts={
            "LiberationSerif":fontdir+"LiberationSerif-Regular.ttf",
            "LiberationSerif-Bold":fontdir+"LiberationSerif-Bold.ttf",
            "LiberationSerif-Italic":fontdir+"LiberationSerif-Italic.ttf",
          }
          reg=fitz.Font(fontfile=fonts["LiberationSerif"])
          ital=fitz.Font(fontfile=fonts["LiberationSerif-Italic"])
          doc=fitz.open(P)
          def replace_region(pageidx, region, offset, rename=None):
            prev=original[pageidx]
            page=doc[pageidx]
            spans=[]
            for block in prev.get_text("dict")["blocks"]:
              for line in block.get("lines",[]):
                for span in line["spans"]:
                  y=span["bbox"][1]
                  if region.y0<=y<region.y1 and span["text"].strip():
                    spans.append(span)
            drawings=prev.get_drawings()
            page.add_redact_annot(region,fill=(1,1,1))
            page.apply_redactions(images=0,graphics=2,text=0)
            for k,path in fonts.items():
              page.insert_font(fontname="CVadd"+k.replace("-",""),fontfile=path)
            for span in spans:
              t=span["text"]
              if rename and t==rename[0]:t=rename[1]
              k=span["font"]
              assert k in fonts,(k,t)
              n=span["color"]; rgb=((n>>16&255)/255,(n>>8&255)/255,(n&255)/255)
              x,y=span["origin"]
              page.insert_text((x,y+offset(span["bbox"][1])),t,
                  fontsize=span["size"],fontname="CVadd"+k.replace("-",""),color=rgb)
            for drawing in drawings:
              rect=drawing["rect"]
              if drawing["type"]=="s" and rect.width>400 and abs(rect.y0-rect.y1)<.15 and region.y0<=rect.y0<region.y1:
                dy=offset(rect.y0)
                page.draw_line((rect.x0,rect.y0+dy),(rect.x1,rect.y1+dy),
                  color=drawing["color"],width=drawing["width"])
          def target(idx,x,y,journal):
            size=11.15
            page=doc[idx]
            label="Target: "
            blueblack=(27/255,32/255,38/255)
            page.insert_text((x,y),label,fontname="CVaddLiberationSerif",fontsize=size,color=blueblack)
            xx=x+reg.text_length(label,fontsize=size)
            page.insert_text((xx,y),journal,fontname="CVaddLiberationSerifItalic",fontsize=size,color=blueblack)
            assert xx+ital.text_length(journal,fontsize=size)<563
          replace_region(0,fitz.Rect(45,536.5,576,744.5),lambda y:15 if y>=588 else 0,
                         ("Papers Under Review","Working Papers"))
          replace_region(1,fitz.Rect(45,121,576,745),lambda y:15 if y<148 else 30)
          target(0,73,598.8,"American Journal of Agricultural Economics")
          target(0,73,727.1,"Review of Industrial Organization")
          target(1,151,101.85,"Review of Industrial Organization")
          target(1,73,131.85,"Journal of International Economics")
          target(1,73,161.85,"Journal of Agricultural Economics")
          out=P.with_name(".cv_working_papers_temp.pdf")
          doc.save(out,garbage=3,deflate=True)
          doc.close()
          check=fitz.open(out)
          assert len(check)==4
          txt="\n".join(p.get_text() for p in check)
          assert txt.count("Target:")==5
          assert "Working Papers" in check[0].get_text()
          assert "Papers Under Review" not in txt
          assert txt.count("Does Market Conduct Matter?")==1
          assert txt.count("Critical Mineral Trade: A Structural Gravity Analysis")==1
          assert "Journal of Agricultural Economics" in txt
          for idx in (2,3):
            assert check[idx].get_text()==original[idx].get_text()
            assert check[idx].get_pixmap().samples==original[idx].get_pixmap().samples
          assert len(check[0].get_links())==len(original[0].get_links())
          for idx,count in ((0,2),(1,3)):
            spans=[s for b in check[idx].get_text("dict")["blocks"] if "lines" in b
                for ln in b["lines"] for s in ln["spans"]
                if any(j in s["text"] for j in (
                  "American Journal of Agricultural Economics",
                  "Review of Industrial Organization",
                  "Journal of International Economics",
                  "Journal of Agricultural Economics"))]
            assert len(spans)==count,spans
            assert all("Italic" in s["font"] for s in spans)
          check.close();original.close()
          os.replace(out,P)
          print("Published searchable, selectable four-page CV with five italic target journals")
          
          PY
      - name: Commit corrected CV and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm '.github/workflows/cv-working-papers-targets-once.yml'
          git add -A assets/Umesh_Gautam_CV.pdf '.github/workflows/cv-working-papers-targets-once.yml'
          git commit -m "Align downloadable CV with working papers and journal targets"
          git push
