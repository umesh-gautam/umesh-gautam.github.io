name: Restore JMP coauthor and normalize teaching CV text
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revert-jmp-authors-and-teaching-once.yml'
permissions:
  contents: write
jobs:
  patch-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
          python -m pip install pymupdf pillow
      - name: Edit only the specified CV lines and validate all four pages
        shell: bash
        run: |
          python - <<'PY'
          import fitz, os
          from pathlib import Path
          from PIL import Image, ImageChops
          path=Path("assets/Umesh_Gautam_CV.pdf")
          base=fitz.open(path)
          doc=fitz.open(path)
          assert len(doc)==4
          R="/usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf"
          B="/usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf"
          I="/usr/share/fonts/truetype/liberation/LiberationSerif-Italic.ttf"
          filefont={"LiberationSerif":R,"LiberationSerif-Bold":B,"LiberationSerif-Italic":I}
          names={"LiberationSerif":"CvReg","LiberationSerif-Bold":"CvBold","LiberationSerif-Italic":"CvItalic"}
          face={k:fitz.Font(fontfile=v) for k,v in filefont.items()}
          def ls(pg):
              return [line for block in pg.get_text("dict")["blocks"] for line in block.get("lines",[]) if "".join(s["text"] for s in line["spans"]).strip()]
          def col(s):
              n=s["color"]
              return ((n>>16&255)/255,(n>>8&255)/255,(n&255)/255)
          def ins(pg,s,dy=0):
              assert s["font"] in names
              pg.insert_text((s["origin"][0],s["origin"][1]+dy),s["text"],
                  fontsize=s["size"],fontname=names[s["font"]],color=col(s))
          p0=doc[0]
          lines=ls(base[0])
          auth=[l for l in lines if "".join(s["text"] for s in l["spans"]).startswith("Umesh Gautam. 2026. Does Market Conduct Matter?")]
          assert len(auth)==1,auth
          description=[l for l in lines if 603<l["bbox"][1]<678 and
              "".join(s["text"] for s in l["spans"]).startswith((
              "Global tree-nut","multiproduct firm","evaluated against",
              "predicts substantial","remain robust"))]
          assert len(description)==5,len(description)
          targets=[l for l in lines if "".join(s["text"] for s in l["spans"]).startswith("Target: American Journal of Agricultural Economics")]
          assert len(targets)==1
          authbox=fitz.Rect(72,558.15,558,571.75)
          bodybox=fitz.Rect(72,588.18,573,677.80)
          for box in [authbox,bodybox]:p0.add_redact_annot(box,fill=(1,1,1))
          p0.apply_redactions(images=0,graphics=0,text=0)
          for k,v in filefont.items():p0.insert_font(fontname=names[k],fontfile=v)
          # Restore the original author citation while retaining bold author and title formatting.
          s=auth[0]["spans"][0]
          x,y=s["origin"]
          for content,font in [
              ("Gautam, U.","LiberationSerif-Bold"),
              (", and S. Devadoss. 2026. ","LiberationSerif"),
              ("Does Market Conduct Matter? Evidence from Global Tree-Nut","LiberationSerif-Bold")]:
              p0.insert_text((x,y),content,fontname=names[font],fontsize=s["size"],color=col(s))
              x+=face[font].text_length(content,fontsize=s["size"])
          assert x<555,x
          # Swap the existing target and the five description lines without changing their sizes.
          for l in description:
              for s in l["spans"]:ins(p0,s,dy=-15.0)
          for s in targets[0]["spans"]:ins(p0,s,dy=76.0)
          # Teaching rows are regular-weight in their entirety; preserve dates and spacing.
          p1=doc[1]
          rows=[l for l in ls(base[1]) if "".join(s["text"] for s in l["spans"]).startswith((
              "Independent Instructor","Teaching Assistant"))]
          assert len(rows)==8,len(rows)
          for l in rows:
              p1.add_redact_annot(fitz.Rect(54.1,l["bbox"][1]-.5,455,l["bbox"][3]+.5),fill=(1,1,1))
          p1.apply_redactions(images=0,graphics=0,text=0)
          p1.insert_font(fontname=names["LiberationSerif"],fontfile=R)
          for l in rows:
              text="".join(s["text"] for s in l["spans"])
              s=l["spans"][0]
              p1.insert_text(s["origin"],text,fontsize=s["size"],
                  fontname=names["LiberationSerif"],color=col(s))
              assert face["LiberationSerif"].text_length(text,fontsize=s["size"])<420
          temp=Path("assets/.cv_author_teaching_temp.pdf")
          doc.save(temp,garbage=3,deflate=True)
          doc.close()
          result=fitz.open(temp)
          t0=" ".join(result[0].get_text().split())
          assert "Gautam, U., and S. Devadoss. 2026. Does Market Conduct Matter?" in t0
          assert "Umesh Gautam. 2026. Does Market Conduct Matter?" not in t0
          assert "Working Papers" in t0
          assert "Scheduled Spring 2027" in result[1].get_text()
          assert sum(result[i].get_text().count("Target:") for i in range(4))==5
          assert "Dr. Jeffrey Luckstead" in result[3].get_text()
          assert all("Bold" not in s["font"] for l in ls(result[1])
             if "".join(s["text"] for s in l["spans"]).startswith((
             "Independent Instructor","Teaching Assistant")) for s in l["spans"])
          desc=[l for l in ls(result[0]) if "".join(s["text"] for s in l["spans"]).startswith((
           "Global tree-nut","remain robust","Target: American Journal"))]
          y={ "".join(s["text"] for s in l["spans"]).split()[0]:l["bbox"][1] for l in desc}
          assert y["Global"]<y["remain"]<y["Target:"],y
          for i in (2,3):
              assert base[i].get_text()==result[i].get_text()
              assert base[i].get_pixmap().samples==result[i].get_pixmap().samples
          for i,box in [(0,fitz.Rect(72,558,558,679)),(1,fitz.Rect(54,207,456,332))]:
              mat=fitz.Matrix(1.5,1.5)
              a=base[i].get_pixmap(matrix=mat,alpha=False)
              b=result[i].get_pixmap(matrix=mat,alpha=False)
              diff=ImageChops.difference(
                  Image.frombytes("RGB",(a.width,a.height),a.samples),
                  Image.frombytes("RGB",(b.width,b.height),b.samples)).getbbox()
              assert diff,(i,diff)
              changed=fitz.Rect(*[z/1.5 for z in diff])
              assert changed.y0>=box.y0-2 and changed.y1<=box.y1+2,(i,changed)
          assert len(result[0].get_links())==len(base[0].get_links())
          result.close();base.close()
          os.replace(temp,path)
          print("Verified restored coauthor, target after paper summary, unbolded teaching and unchanged other content")
          
          PY
      - name: Publish corrected CV and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm '.github/workflows/revert-jmp-authors-and-teaching-once.yml'
          git add -A assets/Umesh_Gautam_CV.pdf '.github/workflows/revert-jmp-authors-and-teaching-once.yml'
          git commit -m "Restore JMP coauthor and regular teaching entries, move target after summary"
          git push
