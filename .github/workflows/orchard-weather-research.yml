name: Orchard weather data connectivity test
on:
  push:
    branches: [research-weather-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retrieve public ERA5-Land observation
        shell: bash
        run: |
          python - <<'PY'
          import csv,json,urllib.request,urllib.parse
          params=dict(latitude="39.666929",longitude="-121.600672",start_date="2010-02-01",end_date="2010-02-03",daily="temperature_2m_min,temperature_2m_max",models="era5_land",timezone="America/Los_Angeles")
          url="https://archive-api.open-meteo.com/v1/archive?"+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={"User-Agent":"AcademicWeatherResearch/1.0"})
          with urllib.request.urlopen(req,timeout=50) as resp: data=json.load(resp)
          assert not data.get("error"),data
          daily=data["daily"]; assert len(daily["time"])==3,daily
          with open("weather_smoke.csv","w",newline="") as f:
            w=csv.writer(f);w.writerow(["date","temperature_2m_min","temperature_2m_max"])
            for row in zip(daily["time"],daily["temperature_2m_min"],daily["temperature_2m_max"]): w.writerow(row)
          print("VALIDATED_REAL_WEATHER",len(daily["time"]),data.get("latitude"),data.get("longitude"))
          print(open("weather_smoke.csv").read())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: test-weather-data
          path: weather_smoke.csv
          if-no-files-found: error
